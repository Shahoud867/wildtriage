# @package _global_
# Stage A: fine-tune SAM 3's detector + mask heads on SA-FARI train frames; both backbones frozen.
# Derived from third_party/sam3 roboflow_v100_full_ft_100_images.yaml. Differences, each on purpose:
#   - segmentation on (the paper's metrics are mask-based), loss includes the mask terms
#   - negatives kept: FilterEmptyTargets removed, so absent phrases and empty frames train the presence head
#   - gloo + one process (Windows), no validation phase (scored afterwards with the Exp 2 VEval harness)
#   - backbone parameters are excluded from checkpoints (frozen, so they equal the released weights)
defaults:
  - _self_

paths:
  data_root: ???            # prepare.py output: train.json + frames/
  experiment_log_dir: ???
  bpe_path: ???

train_transforms:
  - _target_: sam3.train.transforms.basic_for_api.ComposeAPI
    transforms:
      - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
        query_filter:
          _target_: sam3.train.transforms.filter_query_transforms.FilterCrowds
      - _target_: sam3.train.transforms.segmentation.DecodeRle
      - _target_: sam3.train.transforms.basic_for_api.RandomResizeAPI
        sizes:
          _target_: sam3.train.transforms.basic.get_random_resize_scales
          size: ${scratch.resolution}
          min_size: 480
          rounded: false
        max_size:
          _target_: sam3.train.transforms.basic.get_random_resize_max_size
          size: ${scratch.resolution}
        square: true
        consistent_transform: ${scratch.consistent_transform}
      - _target_: sam3.train.transforms.basic_for_api.PadToSizeAPI
        size: ${scratch.resolution}
        consistent_transform: ${scratch.consistent_transform}
      - _target_: sam3.train.transforms.basic_for_api.ToTensorAPI
      - _target_: sam3.train.transforms.basic_for_api.NormalizeAPI
        mean: ${scratch.norm_mean}
        std: ${scratch.norm_std}
  - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
    query_filter:
      _target_: sam3.train.transforms.filter_query_transforms.FilterFindQueriesWithTooManyOut
      max_num_objects: ${scratch.max_ann_per_img}

loss:
  _target_: sam3.train.loss.sam3_loss.Sam3LossWrapper
  normalization: local          # == "global" with one process; gloo all_reduce on CUDA tensors crashes on Windows
  matcher: ${scratch.matcher}
  o2m_weight: 2.0
  o2m_matcher:
    _target_: sam3.train.matcher.BinaryOneToManyMatcher
    alpha: 0.3
    threshold: 0.4
    topk: 4
  use_o2m_matcher_on_o2m_aux: false
  loss_fns_find:
    - _target_: sam3.train.loss.loss_fns.Boxes
      weight_dict:
        loss_bbox: 5.0
        loss_giou: 2.0
    - _target_: sam3.train.loss.loss_fns.IABCEMdetr
      weak_loss: false
      weight_dict:
        loss_ce: 20.0
        presence_loss: 20.0
      pos_weight: 10.0
      alpha: 0.25
      gamma: 2
      use_presence: true
      pos_focal: false
      pad_n_queries: 200
      pad_scale_pos: 1.0
    - _target_: sam3.train.loss.loss_fns.Masks
      focal_alpha: 0.25
      focal_gamma: 2.0
      weight_dict:
        loss_mask: 200.0
        loss_dice: 10.0
      compute_aux: false
  loss_fn_semantic_seg: null
  scale_by_find_batch_size: ${scratch.scale_by_find_batch_size}

scratch:
  d_model: 256
  matcher:
    _target_: sam3.train.matcher.BinaryHungarianMatcherV2
    focal: true
    cost_class: 2.0
    cost_bbox: 5.0
    cost_giou: 2.0
    alpha: 0.25
    gamma: 2
    stable: false
  scale_by_find_batch_size: true
  resolution: 1008
  consistent_transform: false
  max_ann_per_img: 200
  norm_mean: [0.5, 0.5, 0.5]
  norm_std: [0.5, 0.5, 0.5]
  num_train_workers: 3          # each worker is a spawned process: mind the Windows commit limit
  max_epochs: 6
  epoch_frames: 4000            # an "epoch" is a window of new frames (checkpoint every ~45 min); see dataset.py
  micro_batch_size: 4           # frames per forward/backward; the loader yields micro x accumulation frames
  gradient_accumulation_steps: 2
  lr: 8.0e-5                    # 0.1 x the pre-training detector LR, as in SAM 3's fine-tuning configs
  wd: 0.1
  # Our schedule (the paper gives none). Steps are optimizer steps (8 frames each): 6 x 4000 / 8 = 3000 in total.
  # SAM 3's template values (20/20/20) are for few-shot runs and would decay the LR to ~8% by step 3000.
  scheduler_timescale: 500
  scheduler_warmup: 100
  scheduler_cooldown: 300
  collate_fn:
    _target_: sam3.train.data.collator.collate_fn_api_with_chunking
    _partial_: true
    num_chunks: ${scratch.gradient_accumulation_steps}
    repeats: 1
    dict_key: all
    with_seg_masks: true

trainer:
  _target_: sam3.train.trainer.Trainer
  skip_saving_ckpts: false
  empty_gpu_mem_cache_after_eval: true
  skip_first_val: true
  max_epochs: ${scratch.max_epochs}
  accelerator: cuda
  seed_value: 123
  val_epoch_freq: 1000
  mode: train_only
  gradient_accumulation_steps: ${scratch.gradient_accumulation_steps}

  distributed:
    backend: gloo
    find_unused_parameters: true    # some neck levels / mask-head parts take no gradient in text-only training
    static_graph: true              # same used/unused set every step; makes DDP's gradient accumulation (no_sync) valid with them
    gradient_as_bucket_view: true

  loss:
    all: ${loss}
    default:
      _target_: sam3.train.loss.sam3_loss.DummyLoss

  data:
    train:
      _target_: sam3.train.data.torch_dataset.TorchDataset
      dataset:
        _target_: research.training.dataset.WindowedSam3ImageDataset
        coco_json_loader:
          _target_: research.training.data.SaFariFrameLoader
          _partial_: true
        epoch_frames: ${scratch.epoch_frames}
        shuffle_seed: 0
        transforms: ${train_transforms}
        load_segmentation: true
        max_ann_per_img: 500000
        multiplier: 1
        max_train_queries: 50000
        max_val_queries: 50000
        training: true
        use_caching: false
        img_folder: ${paths.data_root}/frames/
        ann_file: ${paths.data_root}/train.json
      shuffle: true
      batch_size: ${times:${scratch.micro_batch_size},${scratch.gradient_accumulation_steps}}
      num_workers: ${scratch.num_train_workers}
      pin_memory: false             # pinned host buffers count toward the Windows commit limit, which this PC hits
      drop_last: true
      collate_fn: ${scratch.collate_fn}

  model:
    _target_: research.training.model.build_sam3_for_finetune
    bpe_path: ${paths.bpe_path}
    device: cpu
    eval_mode: false
    enable_segmentation: true

  meters: null

  optim:
    amp:
      enabled: true
      amp_dtype: bfloat16
    optimizer:
      _target_: torch.optim.AdamW
    gradient_clip:
      _target_: sam3.train.optim.optimizer.GradientClipper
      max_norm: 0.1
      norm_type: 2
    options:
      lr:
        - scheduler:
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
      weight_decay:
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: ${scratch.wd}
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: 0.0
          param_names:
            - '*bias*'
          module_cls_names: ['torch.nn.LayerNorm']

  checkpoint:
    save_dir: ${paths.experiment_log_dir}/checkpoints
    save_freq: 2                  # also keep checkpoint_2/4/6.pt; checkpoint.pt is the latest (resume point)
    skip_saving_parameters:
      - backbone.vision_backbone.trunk.*
      - backbone.language_backbone.*

  logging:
    tensorboard_writer:
      _target_: sam3.train.utils.logger.make_tensorboard_logger
      log_dir: ${paths.experiment_log_dir}/tensorboard
      flush_secs: 120
      should_log: true
    wandb_writer: null
    log_dir: ${paths.experiment_log_dir}/logs
    log_freq: 10

launcher:
  num_nodes: 1
  gpus_per_node: 1
  experiment_log_dir: ${paths.experiment_log_dir}
